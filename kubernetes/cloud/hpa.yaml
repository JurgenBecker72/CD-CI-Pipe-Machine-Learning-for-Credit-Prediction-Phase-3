# kubernetes/cloud/hpa.yaml
# -----------------------------------------------------------------------------
# HPA in cloud is identical to the local one -- the autoscaling primitive
# is the same regardless of where the cluster runs. Replicas climb when
# CPU exceeds 50% of the per-pod request, capped at 3 to keep the demo
# cheap. AKS provisions additional pods on the same B2s node; if the
# cluster's node pool were configured with autoscaling, scaling past the
# node's capacity would also add nodes.
# -----------------------------------------------------------------------------

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: credit-serving
  labels:
    app: credit-serving

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: credit-serving

  minReplicas: 1
  maxReplicas: 3

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
