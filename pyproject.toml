[project]
name = "credit-pipeline"
version = "0.3.0"
description = "Credit risk ML pipeline (Phase 3): scorecard + RF + governance"
authors = [{ name = "Jurgen Bouwer", email = "jurgenb@axconsultgroup.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }

# ---------------------------------------------------------------------------
# Runtime dependencies — what the active pipeline actually imports.
# Optional extras (xgboost, mlflow, fastapi, duckdb, pyspark) live below and
# are pulled in by the phase that introduces them.
# ---------------------------------------------------------------------------
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
    "scipy>=1.11,<2.0",
    "openpyxl>=3.1,<4.0",
    "joblib>=1.3,<2.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
]

# Optional dependency groups, installed selectively. Examples:
#   uv sync --extra warehouse
#   uv sync --all-extras
[project.optional-dependencies]
warehouse = [
    "duckdb>=1.0,<2.0",
    # The data contract validator is hand-rolled in
    # src/data/contracts/application.py rather than depending on Great
    # Expectations. GE 1.5.x pins pandas<2.2 (incompatible with our 2.2+
    # requirement) and GE 1.6+ has a known wheel-packaging bug; the
    # hand-rolled validator runs the same five checks via plain pandas
    # with zero external dependency. Re-add GE here if a future release
    # resolves both issues.
]
mlflow = [
    "mlflow>=2.16,<3.0",
    "shap>=0.45,<1.0",
]
serving = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "prometheus-client>=0.20,<1.0",
]
spark = [
    "pyspark>=3.5,<4.0",
]
gbm = [
    "xgboost>=2.1,<3.0",
    "lightgbm>=4.5,<5.0",
]

# Development dependency groups (PEP 735). Excluded from production images
# via `uv sync --no-dev` in the Dockerfile.
[dependency-groups]
lint = [
    "ruff>=0.6,<1.0",
    "black>=24.10,<26.0",
]
test = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    # httpx is FastAPI TestClient's underlying HTTP library. Listed as a test
    # dependency rather than a serving runtime dependency so it doesn't ship
    # in the production serving image.
    "httpx>=0.27,<1.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "pre-commit>=3.7,<5.0",
    "ipython>=8.20,<10.0",
]

[tool.uv]
# Don't try to package this project; we run it in-place from /app.
package = false

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    archive
  | data
  | models
  | reports
  | warehouse
  | mlflow-data
  | \.venv
  | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["archive", "data", "models", "reports", "warehouse", "mlflow-data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = [
    "E501",
    "B008",
    "N803",
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101"]
# Spark ML Estimator/Transformer APIs are inherited from a Java-derived
# parent (pyspark.ml.Estimator). The base class declares attributes and
# methods in camelCase (inputCols, setInputCols, saveImpl) and the Spark
# machinery looks them up by exact name; renaming would break the
# protocol. The `F` alias for pyspark.sql.functions is universal Spark
# idiom. These exemptions are scoped tightly to files that integrate
# with Spark ML.
"src/features/quantile_flagger.py" = ["N802", "N803", "N812", "N815"]
"src/features/spark_features.py" = ["N802", "N812"]
"src/features/spark_session.py" = ["N812"]
"src/features/pipeline.py" = ["N812"]
"src/training/train.py" = ["N812"]
"scripts/smoke_quantile_flagger.py" = ["N812"]
"scripts/diagnose_spark.py" = ["N812"]
"tests/test_spark_features.py" = ["N802", "N812", "N815", "S101"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --disable-warnings --strict-markers"
testpaths = ["tests", "pipelines"]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "integration: marks tests that run the full pipeline end-to-end (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
